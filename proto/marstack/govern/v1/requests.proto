syntax = "proto3";

package marstack.govern.v1;

import "google/protobuf/timestamp.proto";
import "marstack/govern/v1/common.proto";
import "marstack/govern/v1/tenancy.proto";

option go_package = "github.com/marstack-labs/marstack-govern/gen/marstack/govern/v1;governv1";

service RequestService {
  rpc RecommendQuota(RecommendQuotaRequest) returns (RecommendQuotaResponse);
  rpc Preflight(PreflightRequest) returns (PreflightResponse);
  rpc SubmitRequest(SubmitRequestRequest) returns (SubmitRequestResponse);
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse);
  rpc WithdrawRequest(WithdrawRequestRequest) returns (WithdrawRequestResponse);
}

message ResourceRequest {
  string uid = 1;
  Kind kind = 2;
  string name = 3;
  string namespace = 4;
  string division = 5;
  Actor requester = 6;
  string reason = 7;
  Phase phase = 8;
  QuotaSpec quota = 9;
  AccessSpec access = 10;
  PeeringSpec peering = 11;
  QuotaRecommendation recommendation = 12;
  PreflightResult preflight = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp expires_at = 15;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_QUOTA = 1;
    KIND_ACCESS = 2;
    KIND_PEERING = 3;
    KIND_MEMBERSHIP = 4;
    KIND_NAMESPACE = 5;
    KIND_EPHEMERAL_ENVIRONMENT = 6;
  }

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_PENDING = 1;
    PHASE_PREFLIGHT_FAILED = 2;
    PHASE_AWAITING_DECISION = 3;
    PHASE_APPROVED = 4;
    PHASE_REJECTED = 5;
    PHASE_CHANGES_REQUESTED = 6;
    PHASE_APPLIED = 7;
    PHASE_EXPIRED = 8;
    PHASE_WITHDRAWN = 9;
  }
}

message QuotaSpec {
  Compute target = 1;
}

message AccessSpec {
  string namespace = 1;
  Member.Role role = 2;
  string duration = 3;
}

message PeeringSpec {
  string from_namespace = 1;
  string to_namespace = 2;
  repeated int32 ports = 3;
  string duration = 4;
}

message QuotaRecommendation {
  Compute current = 1;
  Compute observed_p95 = 2;
  Compute observed_p99 = 3;
  Compute proposed = 4;
  double headroom_ratio = 5;
  google.protobuf.Timestamp exhaustion_at = 6;
  int32 exhaustion_confidence_days = 7;
  string window = 8;
  string basis = 9;
}

message PreflightResult {
  bool admitted = 1;
  repeated PolicyRejection rejections = 2;
  string diff = 3;
  Compute quota_after = 4;
  double quota_utilisation_after = 5;
  google.protobuf.Timestamp evaluated_at = 6;
}

message PolicyRejection {
  string policy = 1;
  string rule = 2;
  string field = 3;
  string message = 4;
  Severity severity = 5;

  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_WARN = 1;
    SEVERITY_BLOCK = 2;
  }
}

message RecommendQuotaRequest {
  string division = 1;
  string window = 2;
}

message RecommendQuotaResponse {
  QuotaRecommendation recommendation = 1;
  Freshness freshness = 2;
}

message PreflightRequest {
  string division = 1;
  ResourceRequest.Kind kind = 2;
  QuotaSpec quota = 3;
  AccessSpec access = 4;
  PeeringSpec peering = 5;
  string manifest = 6;
}

message PreflightResponse {
  PreflightResult result = 1;
  Freshness freshness = 2;
}

message SubmitRequestRequest {
  string division = 1;
  ResourceRequest.Kind kind = 2;
  string reason = 3;
  QuotaSpec quota = 4;
  AccessSpec access = 5;
  PeeringSpec peering = 6;
  string idempotency_key = 7;
}

message SubmitRequestResponse {
  ResourceRequest request = 1;
}

message ListRequestsRequest {
  string division = 1;
  ResourceRequest.Phase phase = 2;
  bool mine_only = 3;
  Page page = 4;
}

message ListRequestsResponse {
  repeated ResourceRequest requests = 1;
  PageInfo page = 2;
  Freshness freshness = 3;
}

message GetRequestRequest {
  string uid = 1;
}

message GetRequestResponse {
  ResourceRequest request = 1;
  Freshness freshness = 2;
}

message WithdrawRequestRequest {
  string uid = 1;
  string reason = 2;
}

message WithdrawRequestResponse {
  ResourceRequest request = 1;
}
