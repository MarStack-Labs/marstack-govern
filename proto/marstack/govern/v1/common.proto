syntax = "proto3";

package marstack.govern.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/marstack-labs/marstack-govern/gen/marstack/govern/v1;governv1";

message Freshness {
  google.protobuf.Timestamp observed_at = 1;
  string resource_version = 2;
  int64 projection_lag_seconds = 3;
  repeated DegradedSource degraded = 4;
}

message DegradedSource {
  string source = 1;
  string reason = 2;
  google.protobuf.Timestamp last_healthy_at = 3;
}

message Page {
  int32 size = 1;
  string token = 2;
}

message PageInfo {
  string next_token = 1;
  int32 total = 2;
}

message Money {
  string currency = 1;
  string amount = 2;
}

message Compute {
  int64 cpu_millicores = 1;
  int64 memory_bytes = 2;
  int64 storage_bytes = 3;
  int32 pods = 4;
}

message Actor {
  string subject = 1;
  repeated string groups = 2;
  string acting_division = 3;
}

message ErrorDetail {
  Reason reason = 1;
  string message = 2;
  repeated string fields = 3;
  string policy = 4;
  string remediation = 5;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_NOT_PERMITTED = 1;
    REASON_POLICY_REJECTED = 2;
    REASON_QUOTA_EXCEEDED = 3;
    REASON_PREFLIGHT_FAILED = 4;
    REASON_STALE_PROJECTION = 5;
    REASON_SOURCE_UNAVAILABLE = 6;
    REASON_DECISION_EXPIRED = 7;
    REASON_CONFLICT = 8;
    REASON_NOT_FOUND = 9;
  }
}
