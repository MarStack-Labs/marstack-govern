name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
        env:
          GOVERN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/govern_test?sslmode=disable
      - run: gofmt -l . | tee /dev/stderr | (! read)

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/bufbuild/buf/cmd/buf@latest
        env:
          GOTOOLCHAIN: auto
      - run: buf format -d --exit-code
      - run: buf lint
      - name: The contracts stay backward compatible
        run: buf breaking --against ".git#ref=origin/main,subdir=."
        if: github.event_name == 'pull_request'

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence medium -exclude=G124,G204,G301,G302,G304,G306,G703 ./...

      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks git --no-banner --redact
